# SvelteKit + Supabase Starter — Docker Compose
#
#   docker compose up -d        # start the app on http://localhost:5173
#   docker compose logs -f      # follow logs
#   docker compose down         # stop
#
# Requires a Supabase project. Set your credentials in .env or environment.

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      - PUBLIC_SUPABASE_URL=${PUBLIC_SUPABASE_URL}
      - PUBLIC_SUPABASE_ANON_KEY=${PUBLIC_SUPABASE_ANON_KEY}
      - PRIVATE_SUPABASE_URL=${PRIVATE_SUPABASE_URL}
      - PRIVATE_SUPABASE_ANON_KEY=${PRIVATE_SUPABASE_ANON_KEY}
      - PRIVATE_SUPABASE_SERVICE_ROLE_KEY=${PRIVATE_SUPABASE_SERVICE_ROLE_KEY}
      - MOCK_PLAN_SEATS=${MOCK_PLAN_SEATS:-3}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5173/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
